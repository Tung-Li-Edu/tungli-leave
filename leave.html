<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>東立文理｜請假</title>
<!-- 東立文理 請假頁（LIFF）v1120-3：放在 GitHub Pages，資料由聯絡本網頁的 Apps Script 處理 -->
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{
    --brand:#21376E; --brand-soft:#E8ECF6; --bg:#F5F6FA; --card:#fff; --ink:#1F2430; --muted:#6B7180;
    --line:#E2E5EE; --ok:#2F6B4F; --ok-soft:#E3EFE7; --danger:#B3261E; --danger-soft:#FBE4E2;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    padding-bottom:calc(24px + env(safe-area-inset-bottom))}
  header{background:var(--brand);color:#fff;padding:18px 18px 16px}
  header h1{margin:0;font-size:20px;letter-spacing:.04em}
  header p{margin:2px 0 0;font-size:13px;opacity:.8}
  main{padding:14px;max-width:560px;margin:0 auto}
  .card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(20,30,60,.06)}
  .label{font-size:14px;font-weight:600;color:var(--brand);margin:0 0 8px}
  select,textarea{width:100%;font:inherit;color:inherit;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff}
  select:focus,textarea:focus{outline:none;border-color:var(--brand)}
  textarea{resize:vertical;min-height:72px}
  .opt{display:flex;align-items:center;gap:12px;padding:13px 4px;border-top:1px solid var(--line);cursor:pointer}
  .opt:first-of-type{border-top:0}
  .opt input{width:22px;height:22px;accent-color:var(--brand);flex:none}
  .opt .d{font-weight:600;white-space:nowrap}
  .opt .c{color:var(--muted);font-size:15px}
  .btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:700;font-size:17px;background:var(--brand);color:#fff}
  .btn:disabled{opacity:.45}
  .row{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
  .row:first-of-type{border-top:0}
  .row .t{flex:1;min-width:0}
  .row .t small{display:block;color:var(--muted);font-size:13px}
  .cancel{border:1.5px solid var(--danger);color:var(--danger);background:#fff;border-radius:10px;padding:7px 12px;font:inherit;font-size:14px;font-weight:600;flex:none}
  .cancel.sure{background:var(--danger);color:#fff}
  .empty{color:var(--muted);font-size:15px;padding:4px 0}
  .msg{border-radius:12px;padding:12px 14px;margin-bottom:14px;white-space:pre-line;font-size:15px}
  .msg.ok{background:var(--ok-soft);color:var(--ok)}
  .msg.err{background:var(--danger-soft);color:var(--danger)}
  .hint{font-size:13px;color:var(--muted);margin:8px 2px 0}
  .loading{text-align:center;color:var(--muted);padding:48px 0}
  [hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <h1>📝 請假</h1>
  <p>東立文理｜內湖最有溫度的補習班</p>
</header>
<main>
  <div id="msg" class="msg" hidden></div>
  <div id="loading" class="loading">讀取中…</div>

  <div id="app" hidden>
    <div class="card" id="kidCard" hidden>
      <p class="label">孩子</p>
      <select id="kid"></select>
    </div>

    <div class="card">
      <p class="label">要請假的課（可以勾好幾堂）</p>
      <div id="opts"></div>
    </div>

    <div class="card" id="reasonCard" hidden>
      <p class="label">請假原因（選填）</p>
      <textarea id="reason" maxlength="100" placeholder="例如：身體不舒服、家庭旅遊…"></textarea>
      <p class="hint">勾了好幾堂也只要寫一次</p>
    </div>

    <button class="btn" id="submit" disabled>請先勾選要請假的課</button>

    <div class="card" style="margin-top:18px">
      <p class="label">已申請的請假</p>
      <div id="done"></div>
      <p class="hint">上課當天以前都可以取消。補課連結上傳後，按選單「補課」就看得到。</p>
    </div>
  </div>
</main>

<script>
/* ===== 只要改這兩行 ===== */
const LIFF_ID = '2012709824-cIRR8hL2';
const API_URL = '在這裡貼上 Apps Script 網頁應用程式網址（結尾是 /exec）';
/* ======================== */

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let KIDS = [], busy = false;

function showMsg(text, ok) {
  const m = $('#msg');
  m.textContent = text; m.className = 'msg ' + (ok ? 'ok' : 'err'); m.hidden = !text;
  if (text) window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function api(action, extra) {
  const res = await fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify(Object.assign({ liff: action, idToken: liff.getIDToken() }, extra || {})),
  });
  return res.json();
}

function kidNow() { return KIDS.find(k => k.name === $('#kid').value) || KIDS[0]; }

function render() {
  const k = kidNow();
  if (!k) return;
  const todo = k.classes.filter(c => !c.on), done = k.classes.filter(c => c.on);
  $('#opts').innerHTML = todo.length
    ? todo.map(c => {
        const sp = c.label.indexOf(' ');
        return `<label class="opt"><input type="checkbox" value="${esc(c.id)}"><span><span class="d">${esc(c.label.slice(0, sp))}</span> <span class="c">${esc(c.label.slice(sp + 1))}</span></span></label>`;
      }).join('')
    : done.length ? '<div class="empty">接下來 3 週的課都已經請好假了 ✅</div>'
    : `<div class="empty">接下來 3 週沒有可以請假的課 🙂<br>如果需要請假，請直接傳訊息給主任。</div>`;
  $('#done').innerHTML = done.length
    ? done.map(c => `<div class="row"><div class="t">✅ ${esc(c.label)}</div><button class="cancel" data-id="${esc(c.id)}">取消</button></div>`).join('')
    : '<div class="empty">目前沒有</div>';
  document.querySelectorAll('#opts input').forEach(i => i.onchange = refreshBtn);
  document.querySelectorAll('#done .cancel').forEach(b => b.onclick = () => cancel(b));
  refreshBtn();
}

function picked() { return [...document.querySelectorAll('#opts input:checked')].map(i => i.value); }

function refreshBtn() {
  const n = picked().length, b = $('#submit');
  $('#reasonCard').hidden = !n;
  b.disabled = !n || busy;
  if (!busy) b.textContent = n ? `送出請假（${n} 堂）` : '請先勾選要請假的課';
}

// 在聊天室留一則紀錄（以家長的名義送出，不扣官方帳號的訊息額度；不在 LINE 裡開就略過）
async function chatLog(r) {
  if (!r.ok || !r.log || !liff.isInClient()) return;
  try { await liff.sendMessages([{ type: 'text', text: r.log }]); } catch (e) {}
}

function apply(r) {
  if (r.kids) { KIDS = r.kids; render(); }
  if (r.msg) showMsg(r.msg, r.ok);
}

async function submit() {
  const ids = picked();
  if (!ids.length || busy) return;
  busy = true; $('#submit').disabled = true; $('#submit').textContent = '送出中…';
  try {
    const r = await api('submit', { kid: kidNow().name, ids, reason: $('#reason').value });
    busy = false;
    if (r.ok) $('#reason').value = '';
    await chatLog(r);
    apply(r);
  } catch (e) {
    busy = false;
    showMsg('網路不穩，送出失敗，請再試一次 🙏', false);
  }
  refreshBtn();
}

async function cancel(b) {
  if (busy) return;
  if (!b.classList.contains('sure')) {   // 第一次按：變成「確定取消？」，3 秒內再按一次才取消
    b.classList.add('sure'); b.textContent = '確定取消？';
    setTimeout(() => { if (b.isConnected && !busy) { b.classList.remove('sure'); b.textContent = '取消'; } }, 3000);
    return;
  }
  busy = true; b.disabled = true; b.textContent = '取消中…';
  try {
    const r = await api('cancel', { kid: kidNow().name, id: b.dataset.id });
    busy = false;
    await chatLog(r);
    apply(r);
  } catch (e) {
    busy = false;
    showMsg('網路不穩，取消失敗，請再試一次 🙏', false);
    render();
  }
}

(async function start() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    const r = await api('init');
    $('#loading').hidden = true;
    if (!r.ok) { showMsg(r.msg, false); return; }
    KIDS = r.kids;
    $('#kid').innerHTML = KIDS.map(k => `<option>${esc(k.name)}</option>`).join('');
    $('#kidCard').hidden = KIDS.length < 2;
    $('#kid').onchange = () => { showMsg(''); render(); };
    $('#submit').onclick = submit;
    $('#app').hidden = false;
    render();
  } catch (e) {
    $('#loading').hidden = true;
    showMsg('頁面開不起來 🙏 請關掉後重新按選單的「請假」；還是不行請直接傳訊息給主任。', false);
    console.error(e);
  }
})();
</script>
</body>
</html>
